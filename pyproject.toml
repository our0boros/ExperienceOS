[project]
name = "experience-os"
version = "0.1.0"
description = "ExperienceOS: compile agent trajectories into reusable executable harnesses"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.7",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]
tau2 = ["audioop-lts>=0.2; python_version>='3.13'"]
embeddings = [
    "sentence-transformers>=3.0",
    "torch>=2.0",
]
env-info = ["psutil>=5.9"]

[project.scripts]
experience-os = "experience_os.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["experience_os"]

[tool.ruff]
line-length = 100
target-version = "py311"
